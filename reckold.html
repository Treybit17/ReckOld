<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RECKOLD</title><style>
:root{font-family:Arial,sans-serif;color:#f6f3ff;background:#10101b}*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;background:#1b172c;border-bottom:1px solid #42335b}h1{margin:0;font-size:24px}.logo{color:#7de8ff;background:#352650;padding:9px;border-radius:12px;margin-right:8px}main{max-width:640px;margin:20px auto;padding:0 15px}.panel{background:#252037;border:1px solid #44375f;border-radius:17px;padding:17px;margin-bottom:16px}button{border:0;border-radius:10px;background:#7de8ff;color:#151125;font-weight:bold;padding:10px 15px;cursor:pointer}button.secondary{background:#473a65;color:white}button:focus,input:focus,textarea:focus{outline:2px solid #d77fff}input,textarea{width:100%;border-radius:9px;border:1px solid #6b5984;background:#151322;color:white;padding:12px;margin:7px 0}textarea{resize:vertical;min-height:80px}.posttext{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}.muted{color:#bbb2d1;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hidden{display:none}nav{display:flex;gap:8px;flex-wrap:wrap}nav button{background:#45345f;color:#fff}.post-image{max-width:100%;max-height:360px;border-radius:12px;margin-top:12px}.comment{background:#171424;border-radius:9px;padding:9px;margin-top:8px;overflow-wrap:anywhere}.userline{display:flex;align-items:center;gap:10px}.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#5b4388;display:grid;place-items:center;font-weight:bold}.badge{color:#76dfff}small{color:#bfb4d0}#profileAvatar{width:70px;height:70px}.notice{background:#392a54;padding:10px;border-radius:10px;margin-bottom:15px;font-size:13px}
</style></head><body><header><h1><span class="logo">RO 👑</span>RECKOLD</h1><nav><button onclick="show('home')">Home</button><button onclick="show('create')">+ Post</button><button onclick="show('profile')">Profile</button></nav></header><main><div class="notice">RECKOLD TEST VERSION • Posts and profiles are saved only in this browser. No real accounts or public uploads.</div><section id="home"><h2>For You ✨</h2><div id="feed"></div></section><section id="create" class="hidden"><div class="panel"><h2>Create a post</h2><textarea id="postText" maxlength="1000" placeholder="What's happening?"></textarea><label>Photo (optional)<input id="photo" type="file" accept="image/*"></label><button onclick="addPost()">Publish test post</button><p class="muted">Images are stored in this browser only. Keep them small.</p></div></section><section id="profile" class="hidden"><div class="panel"><h2>My Profile</h2><div class="userline"><div id="profilePic"></div><div><strong id="profileName"></strong><p class="muted" id="stats"></p></div></div><label>Username<input id="username" maxlength="25" placeholder="Your username"></label><label>Profile picture<input id="avatarUpload" type="file" accept="image/*"></label><button onclick="saveProfile()">Save profile</button></div></section></main><script>
const KEY='reckold-demo-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){};state=state||{username:'Trey',avatar:'',posts:[{id:1,user:'Reckold',text:'Welcome to RECKOLD! 👑 This is our first test post.',likes:0,liked:false,comments:[],following:false,avatar:''}]};function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Browser storage is full. Try a smaller photo.')}}function el(tag,cls,txt){let x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}function show(page){for(const id of ['home','create','profile'])document.getElementById(id).classList.toggle('hidden',id!==page);if(page==='home')render();if(page==='profile')profile()}function pic(src,name){if(src){let i=el('img','avatar');i.src=src;return i}return el('div','avatar',(name||'R')[0].toUpperCase())}function profile(){document.getElementById('username').value=state.username;document.getElementById('profileName').textContent='@'+state.username;document.getElementById('stats').textContent=state.posts.filter(p=>p.user===state.username).length+' posts • Test profile';let p=document.getElementById('profilePic');p.replaceChildren(pic(state.avatar,state.username))}function readImage(file){return new Promise((resolve,reject)=>{if(!file)return resolve('');if(file.size>1200000)return reject(Error('Choose an image smaller than 1.2 MB.'));let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('Could not read photo'));r.readAsDataURL(file)})}async function saveProfile(){let name=document.getElementById('username').value.trim().replace(/[^a-zA-Z0-9_]/g,'').slice(0,25);if(!name)return alert('Enter a username using letters, numbers, or underscores.');try{let f=document.getElementById('avatarUpload').files[0],img=f?await readImage(f):state.avatar;let old=state.username;state.username=name;state.avatar=img;state.posts.forEach(p=>{if(p.user===old){p.user=name;p.avatar=img}});save();profile();alert('Profile saved!')}catch(e){alert(e.message)}}async function addPost(){let text=document.getElementById('postText').value.trim();try{let image=await readImage(document.getElementById('photo').files[0]);if(!text&&!image)return alert('Add text or a photo first.');state.posts.unshift({id:Date.now(),user:state.username,text,photo:image,likes:0,liked:false,comments:[],following:false,avatar:state.avatar});save();document.getElementById('postText').value='';document.getElementById('photo').value='';show('home')}catch(e){alert(e.message)}}function render(){let feed=document.getElementById('feed');feed.replaceChildren();for(let p of state.posts){let card=el('article','panel');let line=el('div','userline');line.append(pic(p.avatar,p.user));let name=el('strong','', '@'+p.user);line.append(name);if(p.following)line.append(el('small','badge','✓ Following'));card.append(line);if(p.text)card.append(el('p','posttext',p.text));if(p.photo){let img=el('img','post-image');img.src=p.photo;img.alt='Post image';card.append(img)}let actions=el('div','actions');let like=el('button','secondary',(p.liked?'❤️':'♡')+' '+p.likes);like.onclick=()=>{p.liked=!p.liked;p.likes+=p.liked?1:-1;save();render()};actions.append(like);let follow=el('button','secondary',p.following?'Following ✓':'Follow +');follow.onclick=()=>{p.following=!p.following;save();render()};actions.append(follow);if(p.user===state.username){let del=el('button','secondary','Delete post');del.onclick=()=>{if(confirm('Delete this test post?')){state.posts=state.posts.filter(x=>x.id!==p.id);save();render()}};actions.append(del)}card.append(actions);let comments=el('div');for(let c of p.comments){let item=el('div','comment');item.append(el('strong','', '@'+c.user+': '),el('span','',c.text));if(c.user===state.username||p.user===state.username){let d=el('button','secondary','Delete');d.style.marginLeft='8px';d.onclick=()=>{p.comments=p.comments.filter(x=>x.id!==c.id);save();render()};item.append(d)}comments.append(item)}card.append(comments);let field=el('input');field.placeholder='Write a comment';field.maxLength=300;let send=el('button','','Comment');send.onclick=()=>{let t=field.value.trim();if(!t)return;p.comments.push({id:Date.now()+Math.random(),user:state.username,text:t});save();render()};card.append(field,send);feed.append(card)}}save();render();
</script></body></html>
